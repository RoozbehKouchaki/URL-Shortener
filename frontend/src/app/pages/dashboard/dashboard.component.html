<section class="dashboard">
  <header>
    <h1>URL Shortener</h1>
    <div class="user">
      @if (username) {
        <span>Signed in as <strong>{{ username }}</strong></span>
      }
      <button type="button" (click)="signOut()">Sign out</button>
    </div>
  </header>

  <app-create-link (created)="linksTable.reload()" />

  <app-my-links #linksTable />
</section>
