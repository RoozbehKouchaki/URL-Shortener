<section class="login">
  <h1>Create account</h1>
  <p class="subtitle">Pick a username and password.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        autofocus
        [class.invalid]="isInvalid('username')"
        [attr.aria-invalid]="isInvalid('username')"
        aria-describedby="username-error"
      />
      @if (isInvalid('username')) {
        <p id="username-error" class="field-error">Username must be 3-30 characters.</p>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [class.invalid]="isInvalid('password')"
        [attr.aria-invalid]="isInvalid('password')"
        aria-describedby="password-error"
      />
      @if (isInvalid('password')) {
        <p id="password-error" class="field-error">Password must be at least 8 characters.</p>
      }
    </div>

    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Creating account...' : 'Create account' }}
    </button>
  </form>

  <p class="subtitle"><a routerLink="/login">Already have an account? Sign in</a></p>
</section>
