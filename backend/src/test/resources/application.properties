# Tests run against in-memory H2 for speed. Testcontainers with a real Postgres
# would be the production-grade choice.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests must not start the compose services.
spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.base-address=http://localhost:8080

# Fixed test signing secret so tokens are reproducible across test runs.
app.jwt.secret=test-only-secret-0123456789abcdef0123456789abcdef0123456789
app.jwt.issuer=urlshortener-test
app.jwt.access-token-ttl=15m
