spring.application.name=urlshortener

# File-based H2 so links and accounts survive a restart (Req 8.1).
# AUTO_SERVER allows the H2 console to attach while the app is running.
spring.datasource.url=jdbc:h2:file:./data/urlshortener;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Configurable Base Address used to build Short URLs (Req 8.2).
app.base-address=http://localhost:8080
