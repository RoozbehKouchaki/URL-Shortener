spring.application.name=urlshortener

# No spring.datasource.* here on purpose. Locally, spring-boot-docker-compose
# starts compose.yml and supplies the connection details. Deployed environments
# set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD instead.

# Demo-only. Production would use Flyway migrations with ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Configurable Base Address used to build Short URLs (Req 8.2).
app.base-address=http://localhost:8080

# HS256 signing secret, 32+ bytes. Dev-only default; override with APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
app.jwt.issuer=urlshortener
# Short-lived: a signed token cannot be revoked before it expires.
app.jwt.access-token-ttl=15m
